<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head lang="en">

    </head>
    <body>

        <div class="container">
            <div th:fragment="header">

                <nav class="navbar navbar-default">
                    <div class="container-fluid">
                        <div class="navbar-header">
                            <a class="navbar-brand" href="/plantaciones">CULTIVOS</a>
                        </div>
                        <ul class="nav navbar-nav">
                            <li class="active"><a href="/plantaciones">Home</a></li>

                            <li class="dropdown" sec:authorize="hasRole('ADMINISTRADOR')">
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">General
                                    <span class="caret"></span></a>
                                <ul class="dropdown-menu">
                                    <li><a href="#" th:href="@{/usuarios}">Usuarios</a></li>
                                    <li><a href="#" th:href="@{/roles}">Roles</a></li>
                                </ul>
                            </li>

                            <li class="dropdown">
                                <a class="dropdown-toggle" data-toggle="dropdown" href="#">Cultivos
                                    <span class="caret"></span></a>
                                <ul class="dropdown-menu">
                                    <li><a href="#" th:href="@{/cultivos}">Cultivos</a></li>
                                    <li><a href="#" th:href="@{/plantaciones}">Plantaciones</a></li>
                                    <li><a href="#" th:href="@{/cosechas}">Cosechas</a></li>
                                    <li><a href="#" th:href="@{/gastos}">Gastos</a></li>
                                    <li><a href="#" th:href="@{/ventas}">Ventas</a></li>
                                    <li><a href="#" th:href="@{/compradores}">Compradores</a></li>
                                    <li><a href="#" th:href="@{/lotes}">Lotes</a></li>
                                </ul>
                            </li>

                        </ul>

                        <ul class="nav navbar-nav navbar-right" sec:authorize="isAuthenticated()">
                            <li><p class="navbar-text">Usuario: <b sec:authentication="name"></b></p></li>
                            <li>
                                <form th:action="@{/logout}" method="post" style="margin: 8px 15px;">
                                    <button type="submit" class="btn btn-default btn-sm">Salir</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </nav>

            </div>
        </div>
    </body>
</html>
